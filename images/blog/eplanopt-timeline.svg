<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1456" width="720" height="1456" role="img" aria-labelledby="eplanopt-timeline-title eplanopt-timeline-desc">
  <title id="eplanopt-timeline-title">EPLANopt development timeline, 2014-2026</title>
  <desc id="eplanopt-timeline-desc">Timeline of the EPLANopt energy system model: new methods from the 2018 coupling of EnergyPLAN with an evolutionary algorithm to transition pathways, abatement cost curves, near-optimal solutions, machine learning and explainable AI, and applications from the municipality of Brixen to Italy, European countries and regions, with work continuing in the PLANtoACT project.</desc>
