<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1072" width="720" height="1072" role="img" aria-labelledby="multinode-timeline-title multinode-timeline-desc">
  <title id="multinode-timeline-title">Multi-node energy system modelling, 2017-2026</title>
  <desc id="multinode-timeline-desc">Timeline of multi-node linear programming energy system models: from oemof for the Italian power sector in 2017 to oemof-moea with full sector coupling, energy community models, ELTRAMOD abatement cost curves, oemof with vehicle-to-grid, and a seven-zone PyPSA model of Italy with vehicle-to-grid in 2026, followed by the SURE-RES project with PyPSA-Eur.</desc>
  <defs>
    <style>
      .eyebrow { font: 600 12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .08em; fill: #0f766e; }
      .title { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #1b2421; }
      .col { font: 600 12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .08em; fill: #5d6b66; }
      .yr { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; fill: #1b2421; }
      .name { font: 600 15px Inter, "Segoe UI", Arial, sans-serif; fill: #1b2421; }
      .namef { font: 700 15px Inter, "Segoe UI", Arial, sans-serif; fill: #0f5f58; }
      .sub { font: 400 12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #4a5a55; }
      .legend { font: 400 12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #5d6b66; }
    </style>
  </defs>
